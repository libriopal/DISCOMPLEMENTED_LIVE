version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    # Wait for a release to survive contact with the world before proposing it.
    # The npm compromises worth defending against (event-stream, ua-parser-js,
    # the 2025 chalk/debug wave) were all caught and yanked within days; a bot
    # that opens a PR minutes after publish is the fastest possible path from a
    # hijacked maintainer account into this lockfile.
    cooldown:
      default-days: 7
      semver-major-days: 30
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "deps:"
      include: "scope"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      cohere:
        patterns:
          - "@bicameral/cohere"
          - "@bicameral/shared"
      fluxychat:
        patterns:
          - "@fluxy-chat/*"
      testing:
        patterns:
          - "vitest"
          - "playwright"
          - "msw"
          - "@vitest/*"
    ignore:
      # Don't auto-update Cohere models (manual verification required)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
