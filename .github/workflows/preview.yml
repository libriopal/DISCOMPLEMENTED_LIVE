name: Preview Deploy (PR Previews)

# Three defects fixed here on 2026-08-29, all of the same kind — a step that
# reported success it had not achieved:
#
#  1. `Build` carried `continue-on-error: true`, so a broken build deployed.
#  2. `Deploy` ended `|| echo "deploy-failed"`, which turns a failed
#     `wrangler deploy` into an exit code of 0, and then wrote `preview_url`
#     unconditionally — so the PR got a comment linking a Worker that was
#     never deployed. The URL is now written only on the success path.
#  3. `Cleanup on PR close` was `if: github.event.action == 'closed'` inside a
#     workflow whose trigger types were opened/synchronize/reopened. That
#     condition could never be true, so nothing was ever deleted and
#     `bicameral-pr-*` Workers accumulated for the life of the repo. Cleanup
#     is now its own job on the `closed` event, which is the only way it runs
#     at all.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

# A new push supersedes the previous preview build. Without this, two runs race
# to deploy the same Worker name and the later push can lose.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No continue-on-error. A preview built from a failed build is worse than
      # no preview: it is a URL a reviewer will open and draw conclusions from.
      - name: Build
        run: pnpm build

      - name: Deploy preview to Cloudflare
        id: deploy
        run: |
          set -euo pipefail
          PREVIEW_NAME="bicameral-pr-${{ github.event.pull_request.number }}"
          # --containers-rollout none: the preview shares this repo's
          # [[containers]] application, and a PR preview must not consume the
          # account's preview-container capacity or require docker buildx on
          # the runner.
          npx wrangler deploy --name "$PREVIEW_NAME" --containers-rollout none
          # Reached only if the deploy exited 0.
          echo "preview_url=https://$PREVIEW_NAME.workers.dev" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # KNOWN GAP: `--name` overrides only the Worker's name. The preview keeps
      # the top-level config's D1, R2, KV and Durable Object bindings, so it
      # reads and writes the same data as production. That is why this workflow
      # refuses PRs from forks. Giving previews their own resources is a
      # separate change and is not done here.

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview_url }}';
            const body = [
              '🚀 **Preview deployed**',
              '',
              `Live at: ${url}`,
              '',
              '⚠️ This preview shares production D1/R2/KV bindings. Do not use',
              'it to try destructive actions.',
              '',
              'It is deleted automatically when the PR is closed or merged.',
              '',
              '<!-- bicameral-preview-comment -->'
            ].join('\n');

            // Update the existing comment rather than adding one per push —
            // a long-running PR otherwise accumulates a comment per commit.
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find((c) =>
              c.body?.includes('<!-- bicameral-preview-comment -->')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  cleanup:
    runs-on: ubuntu-latest
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete the preview Worker
        run: |
          set -uo pipefail
          PREVIEW_NAME="bicameral-pr-${{ github.event.pull_request.number }}"
          # A PR closed before its preview ever deployed has nothing to delete;
          # that case is reported and not treated as a failure. Any other
          # failure fails the job, because a delete that silently did nothing is
          # how the orphans accumulated in the first place.
          if ! npx wrangler delete --name "$PREVIEW_NAME" --force 2>deletion.log; then
            if grep -qiE 'not found|does not exist|10007' deletion.log; then
              echo "No preview Worker named $PREVIEW_NAME — nothing to delete."
              exit 0
            fi
            cat deletion.log >&2
            exit 1
          fi
          echo "Deleted $PREVIEW_NAME."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
