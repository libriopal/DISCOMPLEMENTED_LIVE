name: CI — Lint, Type-Check, Unit Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pnpm
        # No `version:` pin — pnpm/action-setup reads `packageManager` from
        # package.json, so the runner and a developer's machine are guaranteed
        # to be the same pnpm. That matters here specifically: pnpm 9 silently
        # ignores the supply-chain settings in pnpm-workspace.yaml.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify agent_docs integrity
        run: |
          echo "Checking agent_docs/ exists and is referenced by CLAUDE.md..."
          if [ ! -d "agent_docs" ]; then
            echo "❌ agent_docs/ directory missing"
            exit 1
          fi
          DOCS_COUNT=$(find agent_docs -name "*.md" | wc -l)
          echo "Found $DOCS_COUNT spec files in agent_docs/"
          if [ "$DOCS_COUNT" -lt 9 ]; then
            echo "⚠️ Expected at least 9 spec files, found $DOCS_COUNT"
          fi
          REF_COUNT=$(grep -c "@agent_docs" CLAUDE.md || echo "0")
          echo "CLAUDE.md references $REF_COUNT agent_docs files via @include"
          if [ "$REF_COUNT" -lt 5 ]; then
            echo "⚠️ CLAUDE.md should reference agent_docs/ files for progressive disclosure"
          fi
          echo "✅ agent_docs integrity check passed"

      - name: Verify no Chatwoot references (use FluxyChat)
        run: |
          echo "Checking for stale Chatwoot references..."
          # Allow "not Chatwoot" in comparison contexts, flag anything else
          if grep -ri "chatwoot" agent_docs/ CLAUDE.md | grep -v "not Chatwoot" | grep -v "vs Chatwoot" | grep -v "FluxyChat | Chatwoot"; then
            echo "⚠️ Stale Chatwoot references found — should be FluxyChat"
            grep -ri "chatwoot" agent_docs/ CLAUDE.md | grep -v "not Chatwoot" | grep -v "vs Chatwoot" | grep -v "FluxyChat | Chatwoot"
          else
            echo "✅ No stale Chatwoot references"
          fi

      - name: Type check (@bicameral/web)
        run: pnpm --filter @bicameral/web typecheck

      - name: Build (@bicameral/web)
        run: pnpm --filter @bicameral/web build

      # Includes the Phase 9 pipeline smoke test (architect.smoke.test.ts):
      # verifies Step 1 (Architect) turns a prompt into a ProjectBrief that
      # satisfies projectBriefSchema, with callAgentModel mocked so this
      # needs no live Cohere key.
      - name: Run unit tests
        run: pnpm test:unit

      # No suite under tests/security/ yet — soft-fail until one exists so
      # this doesn't silently mask real security tests once they land.
      - name: Run security tests
        run: pnpm test:security
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            test-results/
            coverage/

  # Tier-3 preview (Cloudflare Sandboxes) has never been confirmed to build
  # anywhere — this sandbox's local Docker (20.10, no buildx) can't run
  # `docker build --load`, and the container is omitted from both
  # env.staging and env.production in apps/web/wrangler.toml because
  # Cloudflare Containers requires Workers Paid, which isn't provisioned
  # (see bicameral_zero-budget-constraint memory). This job costs nothing —
  # ubuntu-latest ships Docker with buildx — and only builds the image
  # locally to the runner; it never pushes to a registry or touches
  # Cloudflare, so it doesn't require Workers Paid or any paid plan.
  verify-sandbox-container-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Dockerfile.preview (build-only, no push)
        run: docker build -f apps/web/Dockerfile.preview -t bicameral-sandbox:ci apps/web
