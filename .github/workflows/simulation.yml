name: Nightly Monte Carlo Simulation

# §3.5 item 2 — where the Python runs.
#
# The engine cannot run inside a Worker: it is Python, it holds a long-lived
# aiohttp session across dozens of concurrent bots for minutes at a time, and a
# Worker has neither. The daily cron in apps/web/wrangler.toml is the *watchdog*
# (lib/cron-handler.ts, `0 6 * * *`) — it reads what this workflow ingested and
# alerts when the reading is bad or missing. Two hours separate them so a slow
# run is not reported as a missing one.
#
# CONSTRAINT (§CORRECTION 7): this spends real credits against live production
# and its findings are advisory. Nothing here writes production configuration,
# and `applied_to_architecture` stays 0 until a human commits a change by hand.

on:
  schedule:
    # 04:00 UTC daily. Off the hour that genome-sync (02:00) and the credit
    # reset cron (03:00) use, so a bot's view of a user's credit balance is
    # not being reset underneath it mid-run.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      bots:
        description: 'Number of bot personas'
        required: false
        default: '12'
      budget:
        description: 'Credit ceiling for this run (engine hard cap is 500)'
        required: false
        default: '120'

concurrency:
  # Two simulations against live production at once would double the spend and
  # make each one's tripwire counts a reading of the other.
  group: monte-carlo-simulation
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pre-flight before a single credit is spent. This run drives live
      # production for up to 45 minutes against a real credit budget, and the
      # ingest POST is the LAST thing it does — so a missing
      # SIMULATION_INGEST_SECRET previously meant the whole spend happened and
      # then the report 401'd on its way home, with nothing recorded and the
      # next morning's watchdog reading it as a missing run.
      - name: Pre-flight — required secrets
        env:
          SIMULATION_INGEST_SECRET: ${{ secrets.SIMULATION_INGEST_SECRET }}
        run: bash scripts/assert-secrets.sh SIMULATION_INGEST_SECRET:32

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run simulation and ingest the report
        env:
          SIMULATION_INGEST_SECRET: ${{ secrets.SIMULATION_INGEST_SECRET }}
          # Bound as env rather than interpolated into the python3 line below:
          # `${{ inputs.* }}` is pasted in as shell source before bash parses
          # it, so the surrounding double quotes do not contain it. Both are
          # numbers, so they are also range-checked before use.
          SIM_BOTS: ${{ inputs.bots || '12' }}
          SIM_BUDGET: ${{ inputs.budget || '120' }}
        run: |
          set -euo pipefail
          # The engine refuses to run without the secret rather than exiting 0
          # with its findings stranded on a runner that is about to be
          # destroyed — but say so here too, because "secret not configured"
          # and "the pipeline broke" deserve different first guesses.
          if [ -z "${SIMULATION_INGEST_SECRET}" ]; then
            echo "::error::SIMULATION_INGEST_SECRET is not configured on this repository."
            echo "Set it to the same value as the Worker secret of that name:"
            echo "  wrangler secret put SIMULATION_INGEST_SECRET --env production"
            exit 1
          fi
          for pair in "bots=$SIM_BOTS" "budget=$SIM_BUDGET"; do
            if ! printf '%s' "${pair#*=}" | grep -qE '^[0-9]{1,6}$'; then
              echo "::error::--${pair%%=*} must be a positive integer, got '${pair#*=}'"
              exit 1
            fi
          done
          python3 simulation/monte_carlo_engine.py \
            --api https://discomplemented.com \
            --bots "$SIM_BOTS" \
            --budget "$SIM_BUDGET" \
            --concurrency 4 \
            --ingest-url https://discomplemented.com/api/simulation/ingest

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulation-report
          path: simulation/report_*.json
          if-no-files-found: warn
          retention-days: 30

  # §3.5 item 2: "a failed nightly simulation must be visible without anyone
  # going looking." A red tick on the Actions tab only works for someone
  # already on the Actions tab, and a scheduled workflow has no author to
  # notify. This files one issue and keeps commenting on it, rather than
  # opening a new one every night — the second shape trains people to close
  # them unread, which is the same as no alerting.
  report-failure:
    needs: simulate
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = 'Nightly Monte Carlo simulation is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The nightly simulation run failed: ${runUrl}`,
              '',
              'Nothing was ingested, so `simulation_runs` has no row for today and',
              'the 06:00 UTC watchdog will raise a `no_run` alert in the admin',
              'Simulation tab. No production configuration was changed.',
              '',
              'First things to check: `SIMULATION_INGEST_SECRET` matches the Worker',
              'secret of the same name, and https://discomplemented.com/api/healthz',
              'answers.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'simulation',
            });
            const open = existing.data.find((i) => i.title === title);

            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['simulation'],
              });
            }
