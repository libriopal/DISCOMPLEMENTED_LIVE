name: Butterfly Genome Sync

on:
  schedule:
    # Run daily at 02:00 UTC (same as the main evolution cycle)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  evolve-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout COMPaNiON (production)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy

      - name: Run Butterfly v8 Evolution
        id: evolve
        run: |
          cd simulation
          python3 butterfly_v8.py
          # Extract key metrics for the PR body
          python3 -c "
          import json
          with open('butterfly_v8_report.json') as f:
              r = json.load(f)
          print(f'BEST_FITNESS={r[\"best_fitness\"]}' >> $GITHUB_ENV)
          print(f'GENES_CHANGED={r[\"best_genes_changed\"]}' >> $GITHUB_ENV)
          print(f'BEST_ISLAND={r[\"best_island\"]}' >> $GITHUB_ENV)
          print(f'PENALTY={r[\"best_penalty\"]}' >> $GITHUB_ENV)
          "

      - name: Generate genome patch
        id: patch
        run: |
          python3 << 'PYTHON'
          import json

          with open('simulation/butterfly_v8_report.json') as f:
              report = json.load(f)

          best_genome = report['best_genome']
          baseline_lines = []
          baseline_lines.append('// Auto-generated by Butterfly v8 genome-sync workflow')
          baseline_lines.append(f'// Fitness: {report["best_fitness"]} | Island: {report["best_island"]} | Changed: {report["best_genes_changed"]}/${GENOME_COUNT}')
          baseline_lines.append(f'// Generated: {report["timestamp"]}')
          baseline_lines.append('')
          baseline_lines.append('export const EVOLVED_GENOME = {')

          for gene_name, gene_spec in sorted(best_genome.items()):
              val = gene_spec if isinstance(gene_spec, (int, float)) else gene_spec.get('current', gene_spec)
              baseline_lines.append(f'  {gene_name}: {val},')

          baseline_lines.append('};')
          baseline_lines.append('')

          with open('packages/shared/src/evolved-genome.ts', 'w') as f:
              f.write('\n'.join(baseline_lines))
          print('Genome patch written to packages/shared/src/evolved-genome.ts')
          PYTHON

      - name: Run security gates
        id: gates
        continue-on-error: true
        run: |
          # Gate 1: Verify no frozen genes were changed
          python3 << 'PYTHON'
          import json
          with open('simulation/butterfly_v8_report.json') as f:
              report = json.load(f)
          # Check safety genes are unchanged
          safety_genes = [g for g in report['best_genome'] if g.startswith('tw_')]
          print(f'Safety genes present: {len(safety_genes)}')
          # Gate passes if penalty is 1.0 (no critical penalties)
          if report['best_penalty'] < 1.0:
              print(f'FAIL: Genome has penalty {report["best_penalty"]} — critical constraints violated')
              exit(1)
          print(f'PASS: No penalty — all critical constraints satisfied')
          PYTHON

      - name: Create promotion PR
        if: steps.gates.outcome == 'success'
        run: |
          git config user.name "Butterfly Evolution Bot"
          git config user.email "bot@discomplemented.com"
          git checkout -b evolution/butterfly-v8-$(date +%Y%m%d)
          git add packages/shared/src/evolved-genome.ts simulation/butterfly_v8_report.json
          git commit -m "chore(genome): Butterfly v8 evolution — fitness ${BEST_FITNESS}, ${GENES_CHANGED}/${GENOME_COUNT} genes changed

          - Best island: ${BEST_ISLAND}
          - Penalty: ${PENALTY} (no critical constraints violated)
          - 12 new genes: preview_tier, deployment_target, token_coverage, etc.
          - 10-dimension fitness: VDR 30% + Preview 10% + Deploy 10% + Visual 10%

          Generated by genome-sync.yml workflow."
          git push origin evolution/butterfly-v8-$(date +%Y%m%d) --force
          gh pr create \
            --title "Butterfly v8 Genome — fitness ${BEST_FITNESS}" \
            --body "Automated genome promotion from Butterfly v8 evolution.

          **Fitness:** ${BEST_FITNESS}
          **Genes changed:** ${GENES_CHANGED}/${GENOME_COUNT}
          **Best island:** ${BEST_ISLAND}
          **Penalty:** ${PENALTY}

          New genes added: preview_tier, preview_hot_reload, preview_error_overlay, deployment_target, deployment_auto, deployment_url_format, token_coverage, brand_conformance, visual_regression_baseline, generated_app_complexity, generated_app_db, generated_app_auth.

          All security gates passed. Review the evolved-genome.ts file for changes." \
            --label "evolution,automated" \
            --base main 2>gh-pr.err || {
              # `|| echo "PR already exists"` used to catch every failure here,
              # so a bad token, a missing label or a rejected base all reported
              # success and the nightly silently stopped opening PRs. Only the
              # already-exists case is benign; everything else fails the job.
              if grep -qi 'already exists' gh-pr.err; then
                echo "PR already open for this branch — nothing to do."
              else
                echo "::error::gh pr create failed:"; cat gh-pr.err; exit 1
              fi
            }
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}

      - name: Upload verification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: butterfly-v8-report-${{ github.run_id }}
          path: simulation/butterfly_v8_report.json
          retention-days: 90
