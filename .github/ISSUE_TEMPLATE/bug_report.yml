---
name: Bug Report
about: Report a bug or unexpected behavior
title: "[BUG] "
labels: bug
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Subscription Tier
      options:
        - Free
        - Pro
        - Team
        - Enterprise
        - N/A
  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Any relevant error messages or audit logs
